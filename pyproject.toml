[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "gambit"
version = "0.1.0"
description = "Game theoretic Allocation for Model Based Interpretability and Trust"
requires-python = ">=3.12"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "numpy==2.2.6",
    "pillow==11.3.0",
    "tqdm==4.67.1",
    "h5py==3.16.0",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "scikit-image==0.25.2",
    "matplotlib==3.10.7",
    "captum==0.9.0",
    "grad-cam==1.5.7",
    "metrohash-python==1.1.3.3",
]

[tool.setuptools]
py-modules = ["gambit"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modality*", "base_evidence*", "instantiations*"]
